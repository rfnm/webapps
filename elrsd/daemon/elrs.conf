# elrsd config (deployed to /rfnm/apps/elrs/). Rate and window come from the manifest config
# keys (ELRS_RATE / ELRS_FC, written by appd into app.conf); antenna/gain from appd's /rf
# endpoint (ELRS_ANTENNA / ELRS_GAIN / ELRS_AGC). Everything here is optional.
#
# TX STAYS OFF unless all three hold: /rfnm/board.conf TX_ALLOWED permits it, "--tx 1" is
# in ELRS_ARGS below, and a client arms it at runtime (POST /tx/arm with a power at or below
# the cap). Auto-disarm after duration_s (<= --tx-max-duration, default 120 s). The RX path
# is stopped while armed (v1: no duplex).
#
# The binding phrase / UID is NEVER put here or on the command line: set it at runtime with
# PUT /api/app/elrs/config {"binding_phrase":"..."} (the panel has a field for it) or export
# ELRS_BINDING_PHRASE in a private environment file that only root can read; elrsd removes
# the variable from its environment right after reading it.
#
# Extra daemon flags (word-split by systemd via $ELRS_ARGS, unbraced):
#   --conj 0|1           pin the IQ sign (default: auto-probe while no preamble is found)
#   --os 1|4             demod oversampling (4 = the verified path)
#   --tx 1               enable the TX arm gate (see above)
#   --tx-cap-dbm N       hard power cap for POST /tx/arm (default -20)
#   --ws-port N          optional WebSocket push of packets/rc/status on 127.0.0.1:N
ELRS_ARGS=
