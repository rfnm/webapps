# cellscand config (deployed to /rfnm/apps/cellscan/). Only the DEFAULT scan preset lives
# here; the real frequency list is chosen per scan in the POST /scan body, which - unlike a
# manifest config key - is not restricted to a fixed choices[] menu.
#
# preset = the default frequency list when a POST /scan omits freqs_mhz:
#   b20       796, 806, 816 MHz          (the 800 MHz digital-dividend block; reference cells)
#   b20+b8    b20 plus 942, 951 MHz      (add the 900 MHz GSM/LTE band)
#   eu-macro  a spread across B20/B8/B3/B1/B7
#   last      re-run the last scan's frequency list
CELLSCAN_PRESET=b20

# antenna = which RX path the scan uses. The right one is FREQUENCY-dependent, so the default
# is not a path at all but the per-carrier policy:
#   auto   the band policy (src/bandplan.h): embed below 1000 MHz (B20/B8), sma_a above it
#          (B3/B1/B7). Measured on the board: B20 SIB1 decodes ONLY on embed (sma_a stops at
#          mib_only/pss_only), B1 SIB1 decodes ONLY on sma_a - the SMA-A 800 MHz HPF, from
#          both sides. The job groups its carriers so the path changes at most once.
#   embed  pin the internal antenna for the whole job (B20/B28 work)
#   sma_a  pin the SMA-A path for the whole job (what this app shipped with before the policy)
CELLSCAN_ANTENNA=auto

# Extra daemon flags (word-split by systemd via $CELLSCAN_ARGS, unbraced). They come AFTER
# --antenna ${CELLSCAN_ANTENNA} on the command line, so an --antenna here still wins.
#   --gain N     front-end gain, 10-14 (: never 30 - the front end compresses long
#                before the ADC clips, and a too-high gain reads as "no cells" on a live band).
#   --agc 0|1    AGC off by default: a gain change mid-burst invalidates the offline decode.
CELLSCAN_ARGS=--gain 12 --agc 0
