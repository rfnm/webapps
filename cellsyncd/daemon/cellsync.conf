# cellsyncd config (deployed to /rfnm/apps/cellsync/). Pick the frequency from a
# `cellsyncd --scan` survey of local macro cells - strongest FDD carrier wins; the
# daemon tracks up to 4 cells (PCIs) on that carrier and median-combines them.
# Proven on hardware: 751.0 MHz PCI 212 disciplines the Si5510 to ~-1.5 ppb
# residual (native -75 ppb nulled at DCO +744 steps). See README "Hardware proof".
CELLSYNC_FREQ_MHZ=751.0
CELLSYNC_TAU_S=120
# Extra daemon flags (word-split by systemd via $CELLSYNC_ARGS, unbraced).
#   --embed-ant: internal cellular antenna. The SMA-A path has an 800 MHz HPF that blocks
#                the sub-800 MHz macro cells, and the strong local carriers are 739/751.
#   --no-sign-probe: the MR DCO sign is deterministic (+1) and hardware-proven, so skip the
#                startup +-100 ppb probe transient. (Also the default now; kept explicit.)
CELLSYNC_ARGS=--embed-ant --no-sign-probe
